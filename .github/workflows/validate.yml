name: Validar plugin DevSquad AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar JSON
        run: |
          for f in $(find . -name "*.json" -not -path "*/node_modules/*"); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('OK: $f')"
          done

      - name: Instalar pyyaml
        run: pip install pyyaml --break-system-packages

      - name: Validar frontmatter YAML de agentes y skills
        run: |
          python3 - << 'EOF'
          import glob, yaml, sys

          ok = True
          for f in glob.glob("plugins/**/agents/*.md", recursive=True) + \
                    glob.glob("plugins/**/skills/**/SKILL.md", recursive=True):
              content = open(f, encoding="utf-8").read()
              if not content.startswith("---\n"):
                  print(f"FALTA frontmatter: {f}")
                  ok = False
                  continue
              end = content.index("\n---", 4)
              fm = content[4:end]
              try:
                  yaml.safe_load(fm)
                  print(f"OK: {f}")
              except yaml.YAMLError as e:
                  print(f"YAML INVALIDO en {f}: {e}")
                  ok = False

          sys.exit(0 if ok else 1)
          EOF

  pruebas-comportamiento:
    name: pruebas-comportamiento (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # devsquad-estado y los hooks declaran Python 3.8+: se prueban los extremos y los intermedios.
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configurar git (las pruebas crean repositorios temporales)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Pruebas unitarias y de comportamiento (unittest)
        run: python3 -m unittest discover -s tests -v

      - name: Escenarios de integración (flujo completo de un track con las compuertas)
        run: python3 -m unittest tests.test_integracion -v
